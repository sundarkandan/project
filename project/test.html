<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pulse | Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617;
            font-family: 'Inter', sans-serif;
        }
        .neon-text {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.8), 0 0 20px rgba(34, 211, 238, 0.4);
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3), inset 0 0 15px rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.5);
        }
        .neon-button {
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(192, 38, 211, 0.4);
        }
        .neon-button:hover {
            box-shadow: 0 0 20px rgba(192, 38, 211, 0.8);
            transform: translateY(-1px);
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
        }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden relative">
    
    <!-- Background Accents -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-cyan-500/10 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-fuchsia-500/10 rounded-full blur-[120px]"></div>

    <div class="w-full max-w-md z-10">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold neon-text text-cyan-400 tracking-widest uppercase">Nexus</h1>
            <p class="text-slate-400 mt-2 text-sm tracking-tighter">AUTHENTICATION PROTOCOL</p>
        </div>

        <div class="glass-panel neon-border rounded-2xl p-8 shadow-2xl">
            <!-- Tabs -->
            <div class="flex mb-8 bg-slate-900/50 p-1 rounded-lg border border-slate-800">
                <button id="loginTab" onclick="switchTab('login')" class="w-1/2 py-2 text-sm font-semibold rounded-md transition-all duration-300 text-cyan-400 bg-slate-800 shadow-lg">LOGIN</button>
                <button id="registerTab" onclick="switchTab('register')" class="w-1/2 py-2 text-sm font-semibold rounded-md transition-all duration-300 text-slate-400 hover:text-white">REGISTER</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-semibold text-cyan-500 uppercase tracking-wider mb-2">Identify Code (Email)</label>
                    <input type="email" placeholder="user@nexus.io" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                </div>
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-xs font-semibold text-cyan-500 uppercase tracking-wider">Pass-Key</label>
                        <a href="#" class="text-xs text-slate-500 hover:text-cyan-400 transition-colors">Forgot Key?</a>
                    </div>
                    <input type="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all">
                </div>
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg neon-button uppercase tracking-widest text-sm">Initialize Session</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="space-y-6 hidden">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-fuchsia-500 uppercase tracking-wider mb-2">First Alias</label>
                        <input type="text" placeholder="Neo" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-fuchsia-500 focus:ring-1 focus:ring-fuchsia-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-fuchsia-500 uppercase tracking-wider mb-2">Last Alias</label>
                        <input type="text" placeholder="Anderson" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-fuchsia-500 focus:ring-1 focus:ring-fuchsia-500 transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-fuchsia-500 uppercase tracking-wider mb-2">Communication Link</label>
                    <input type="email" placeholder="new.entity@nexus.io" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-fuchsia-500 focus:ring-1 focus:ring-fuchsia-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-fuchsia-500 uppercase tracking-wider mb-2">Establish Pass-Key</label>
                    <input type="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-fuchsia-500 focus:ring-1 focus:ring-fuchsia-500 transition-all">
                </div>
                <button type="submit" class="w-full bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold py-3 rounded-lg neon-button uppercase tracking-widest text-sm" style="box-shadow: 0 0 10px rgba(192, 38, 211, 0.4);">Create Identity</button>
            </form>

            <!-- Social Logins -->
            <div class="mt-8">
                <div class="relative flex items-center justify-center mb-6">
                    <div class="border-t border-slate-800 w-full"></div>
                    <span class="bg-slate-900 px-4 text-xs text-slate-500 uppercase tracking-widest absolute">Network Auth</span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center gap-2 border border-slate-800 rounded-lg py-2 hover:bg-slate-800 transition-colors text-slate-300 text-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.9 3.34-2.12 4.41-1.03.9-2.6 1.82-5.72 1.82-4.72 0-8.58-3.48-8.58-8.43s3.86-8.43 8.58-8.43c2.73 0 4.81 1.06 6.36 2.48l2.46-2.42C19.21 1.63 16.18 0 12.48 0 5.58 0 0 5.58 0 12.5S5.58 25 12.48 25c3.75 0 6.6-1.24 8.82-3.56 2.28-2.32 3-5.52 3-8.15 0-.6-.04-1.2-.12-1.78l-9.22.42-.02-.59z"/></svg>
                        Google
                    </button>
                    <button class="flex items-center justify-center gap-2 border border-slate-800 rounded-lg py-2 hover:bg-slate-800 transition-colors text-slate-300 text-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                        GitHub
                    </button>
                </div>
            </div>
        </div>

        <p class="text-center mt-8 text-slate-600 text-xs font-mono uppercase tracking-tighter">
            &copy; 2024 NEXUS SYSTEMS INTERFACE // ENCRYPTED END-TO-END
        </p>
    </div>

    <script>
        function switchTab(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                
                loginTab.classList.add('text-cyan-400', 'bg-slate-800', 'shadow-lg');
                loginTab.classList.remove('text-slate-400');
                
                registerTab.classList.remove('text-fuchsia-400', 'bg-slate-800', 'shadow-lg');
                registerTab.classList.add('text-slate-400');
                
                document.querySelector('.neon-border').style.borderColor = 'rgba(34, 211, 238, 0.5)';
                document.querySelector('.neon-border').style.boxShadow = '0 0 15px rgba(34, 211, 238, 0.3), inset 0 0 15px rgba(34, 211, 238, 0.1)';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                
                registerTab.classList.add('text-fuchsia-400', 'bg-slate-800', 'shadow-lg');
                registerTab.classList.remove('text-slate-400');
                
                loginTab.classList.remove('text-cyan-400', 'bg-slate-800', 'shadow-lg');
                loginTab.classList.add('text-slate-400');
                
                document.querySelector('.neon-border').style.borderColor = 'rgba(192, 38, 211, 0.5)';
                document.querySelector('.neon-border').style.boxShadow = '0 0 15px rgba(192, 38, 211, 0.3), inset 0 0 15px rgba(192, 38, 211, 0.1)';
            }
        }
    </script>
</body>
</html>
