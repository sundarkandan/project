<!DOCTYPE html><html><head><script src="https://cdn.tailwindcss.com"></script></head><body><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=JetBrains+Mono:wght@300;500&display=swap');
        
        body { 
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
        }

        .neon-border {
            box-shadow: 0 0 5px #0ff, 0 0 10px #0ff, inset 0 0 5px #0ff;
            border: 1px solid #0ff;
        }

        .neon-text-blue {
            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
        }

        .neon-text-pink {
            text-shadow: 0 0 5px #f0f, 0 0 10px #f0f;
        }

        .neon-btn-pink {
            border: 1px solid #f0f;
            box-shadow: inset 0 0 2px #f0f, 0 0 2px #f0f;
        }

        .neon-btn-pink:hover {
            background: #f0f;
            color: #000;
            box-shadow: 0 0 20px #f0f;
        }

        .neon-btn-cyan {
            border: 1px solid #0ff;
            box-shadow: inset 0 0 2px #0ff, 0 0 2px #0ff;
        }

        .neon-btn-cyan:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        .neon-btn-amber {
            border: 1px solid #fbbf24;
            box-shadow: inset 0 0 2px #fbbf24, 0 0 2px #fbbf24;
        }

        .neon-btn-amber:hover {
            background: #fbbf24;
            color: #000;
            box-shadow: 0 0 20px #fbbf24;
        }

        .grid-bg {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 255, 255, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 6s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        .display-font { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 grid-bg overflow-hidden">

    <div class="relative w-full max-w-sm bg-black/80 rounded-3xl p-8 border-2 border-cyan-500/30 shadow-[0_0_50px_rgba(0,255,255,0.1)] overflow-hidden">
        <div class="scanline"></div>
        
        <!-- Header Decor -->
        <div class="flex justify-between items-center mb-6 opacity-50">
            <div class="flex gap-1">
                <div class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></div>
                <div class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse" style="animation-delay: 0.2s"></div>
                <div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" style="animation-delay: 0.4s"></div>
            </div>
            <span class="text-[10px] tracking-[0.2em] text-cyan-400 font-bold uppercase">System-UI v2.0</span>
        </div>

        <!-- Display Area -->
        <div class="mb-8 p-6 bg-black/40 border border-cyan-900/50 rounded-xl relative">
            <div id="prev-display" class="text-right text-pink-500/70 text-sm display-font h-6 mb-1 tracking-widest"></div>
            <div id="curr-display" class="text-right text-cyan-400 text-5xl font-bold display-font truncate neon-text-blue">0</div>
            <!-- Decorative Corners -->
            <div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-cyan-500"></div>
            <div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-cyan-500"></div>
        </div>

        <!-- Buttons Grid -->
        <div class="grid grid-cols-4 gap-4">
            <!-- Row 1 -->
            <button onclick="clearDisplay()" class="neon-btn-pink h-14 rounded-lg text-pink-500 text-sm font-bold transition-all active:scale-95">CLR</button>
            <button onclick="deleteLast()" class="neon-btn-pink h-14 rounded-lg text-pink-500 text-sm font-bold transition-all active:scale-95">DEL</button>
            <button onclick="appendOperator('%')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">%</button>
            <button onclick="appendOperator('/')" class="neon-btn-amber h-14 rounded-lg text-amber-400 text-xl transition-all active:scale-95">÷</button>
            
            <!-- Row 2 -->
            <button onclick="appendNumber('7')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">7</button>
            <button onclick="appendNumber('8')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">8</button>
            <button onclick="appendNumber('9')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">9</button>
            <button onclick="appendOperator('*')" class="neon-btn-amber h-14 rounded-lg text-amber-400 text-xl transition-all active:scale-95">×</button>
            
            <!-- Row 3 -->
            <button onclick="appendNumber('4')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">4</button>
            <button onclick="appendNumber('5')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">5</button>
            <button onclick="appendNumber('6')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">6</button>
            <button onclick="appendOperator('-')" class="neon-btn-amber h-14 rounded-lg text-amber-400 text-xl transition-all active:scale-95">−</button>
            
            <!-- Row 4 -->
            <button onclick="appendNumber('1')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">1</button>
            <button onclick="appendNumber('2')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">2</button>
            <button onclick="appendNumber('3')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">3</button>
            <button onclick="appendOperator('+')" class="neon-btn-amber h-14 rounded-lg text-amber-400 text-xl transition-all active:scale-95">+</button>
            
            <!-- Row 5 -->
            <button onclick="appendNumber('0')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">0</button>
            <button onclick="appendNumber('.')" class="neon-btn-cyan h-14 rounded-lg text-cyan-400 text-lg transition-all active:scale-95">.</button>
            <button onclick="calculate()" class="col-span-2 h-14 rounded-lg bg-cyan-500 text-black font-bold text-xl transition-all active:scale-95 shadow-[0_0_20px_#0ff] hover:bg-white">EXE</button>
        </div>
        
        <!-- Footer Decor -->
        <div class="mt-8 pt-4 border-t border-cyan-900/30 flex justify-center">
            <div class="text-[8px] text-cyan-900 tracking-widest font-bold">NEURAL-LINK PROCESSOR ACTIVE</div>
        </div>
    </div>

    <script>
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        const currDisplay = document.getElementById('curr-display');
        const prevDisplay = document.getElementById('prev-display');

        function updateDisplay() {
            currDisplay.innerText = currentOperand;
            if (operation != null) {
                prevDisplay.innerText = `${previousOperand} ${operation}`;
            } else {
                prevDisplay.innerText = '';
            }
        }

        function clearDisplay() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            updateDisplay();
        }

        function deleteLast() {
            if (currentOperand === '0') return;
            currentOperand = currentOperand.toString().slice(0, -1);
            if (currentOperand === '') currentOperand = '0';
            updateDisplay();
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number.toString();
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                calculate();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '0';
            updateDisplay();
        }

        function calculate() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+': computation = prev + current; break;
                case '-': computation = prev - current; break;
                case '*': computation = prev * current; break;
                case '/': computation = prev / current; break;
                case '%': computation = prev % current; break;
                default: return;
            }

            // Formatting to avoid long decimals
            currentOperand = Math.round(computation * 100000000) / 100000000;
            currentOperand = currentOperand.toString();
            operation = undefined;
            previousOperand = '';
            updateDisplay();
            
            // Neon Flash effect
            currDisplay.classList.remove('neon-text-blue');
            currDisplay.classList.add('text-white');
            setTimeout(() => {
                currDisplay.classList.add('neon-text-blue');
                currDisplay.classList.remove('text-white');
            }, 100);
        }

        // Add visual glitch effect on button click
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const originalShadow = btn.style.boxShadow;
                btn.style.boxShadow = '0 0 30px #fff';
                setTimeout(() => btn.style.boxShadow = originalShadow, 50);
            });
        });
    </script>
</body>
</html></body></html>
